version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: algotech-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    networks:
      - algotech-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: algotech-phpmyadmin
    environment:
      PMA_HOST: mysql-db
      PMA_USER: root
      PMA_PASSWORD: password
      PMA_PORT: 3306
    ports:
      - "8088:80"
    depends_on:
      - mysql-db
    networks:
      - algotech-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: algotech-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - algotech-network

  discovery-service:
    build: ./backend/discovery-service
    container_name: algotech-discovery
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - algotech-network

  api-gateway:
    build: ./backend/api-gateway
    container_name: algotech-gateway
    ports:
      - "8888:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - discovery-service
    networks:
      - algotech-network

  member-service:
    build: ./backend/member-service
    container_name: algotech-member
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - discovery-service
      - mysql-db
    networks:
      - algotech-network

  event-service:
    build: ./backend/event-service
    container_name: algotech-event
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - discovery-service
      - mysql-db
    networks:
      - algotech-network

  booking-service:
    build: ./backend/booking-service
    container_name: algotech-booking
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
    depends_on:
      - discovery-service
      - mysql-db
      - rabbitmq
    networks:
      - algotech-network

  notification-service:
    build: ./backend/notification-service
    container_name: algotech-notification
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
    depends_on:
      - discovery-service
      - mysql-db
      - rabbitmq
    networks:
      - algotech-network

networks:
  algotech-network:
    driver: bridge

volumes:
  mysql-data:
