server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/notification_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: notification_user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
